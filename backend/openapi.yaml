openapi: 3.0.3
info:
  title: Streept API
  version: 2.0.0
  description: Current HTTP API for Streept navigation, community intelligence, parking, traffic, scene data, and billboard beta features.
servers:
  - url: http://localhost:3001/api
    description: Local development
paths:
  /auth/register:
    post: {summary: Register, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthRequest'}}}}, responses: {'200': {description: Registered}}}
  /auth/login:
    post: {summary: Login, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthRequest'}}}}, responses: {'200': {description: Authenticated}}}
  /geocode:
    get: {summary: Search places, parameters: [{name: q, in: query, required: true, schema: {type: string}}], responses: {'200': {description: Search results}}}
  /parking:
    get: {summary: Nearby parking lots, parameters: [{name: destination, in: query, required: true, schema: {type: string, example: '21.1458,79.0882'}}], responses: {'200': {description: Parking lots}}}
  /parking/cars:
    get: {summary: Nearby anonymously displayed parked cars, parameters: [{name: lat, in: query, required: true, schema: {type: number}}, {name: lng, in: query, required: true, schema: {type: number}}, {name: radius, in: query, schema: {type: number, minimum: 50, maximum: 2500}}], responses: {'200': {description: Parked cars}}}
  /parking/checkin:
    post: {summary: Check in to a parking lot, responses: {'200': {description: Updated parking occupancy}}}
  /parking/heartbeat:
    post: {summary: Refresh parking presence, responses: {'200': {description: Updated presence}}}
  /parking/checkout:
    post: {summary: Check out of parking, responses: {'200': {description: Checkout result}}}
  /reports:
    get: {summary: Nearby community reports, responses: {'200': {description: Reports}}}
    post: {summary: Create community report, responses: {'200': {description: Created report}}}
  /reports/{id}/confirm:
    post: {summary: Confirm a report, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Vote result}}}
  /reports/{id}/dismiss:
    post: {summary: Dismiss a report, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Vote result}}}
  /billboards:
    get: {summary: Nearby roadside billboards, responses: {'200': {description: Billboards}}}
  /billboards/{id}/purchase:
    post: {summary: Publish a free-beta billboard ad, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Published billboard}}}
  /billboards/{id}/click:
    post: {summary: Record billboard click, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Click recorded}}}
  /billboards/{id}/moderate:
    post: {summary: Moderate billboard, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Moderation result}}}
  /traffic:
    get: {summary: Live traffic snapshot, responses: {'200': {description: Traffic data}}}
  /traffic/vehicles:
    get: {summary: Live traffic vehicles, responses: {'200': {description: Traffic vehicles}}}
  /traffic/vehicles/ingest:
    post: {summary: Ingest traffic telemetry, responses: {'200': {description: Ingest result}}}
  /offline/plan:
    get: {summary: Offline navigation plan, responses: {'200': {description: Offline plan}}}
  /scene-context:
    get: {summary: OSM-derived 3D scene context, responses: {'200': {description: Scene context}}}
  /scene-tile:
    get: {summary: Cached 3D scene tile, responses: {'200': {description: Scene tile}}}
  /route:
    get: {summary: Calculate route and immersive navigation data, parameters: [{name: from, in: query, required: true, schema: {type: string}}, {name: to, in: query, required: true, schema: {type: string}}], responses: {'200': {description: Route}}}
  /ws:
    get: {summary: Geo-filtered realtime WebSocket, responses: {'101': {description: Switching protocols}}}
components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
