services:
  postgres:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: navigation_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Keep PostgreSQL off the common host port so verification can run
      # alongside another local Postgres/container without a bind conflict.
      # Override with STREEPT_POSTGRES_PORT=5432 when that port is free.
      - "${STREEPT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/navigation_app
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      ROUTING_URL: ${ROUTING_URL:-https://router.project-osrm.org}
      TRAFFIC_REFRESH_SECONDS: ${TRAFFIC_REFRESH_SECONDS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS:-30}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-set-a-real-contact-email@example.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

